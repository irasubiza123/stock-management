<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Stock Management System</title>
  <style>
    body {
      margin: 0;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      background-image: url('images/wall.jpg'); /* Replace with your image filename */
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      height: 100vh;
      color: #ffffff;
    }

    .container {
      background-color: rgba(0, 0, 0, 0.7);
      margin: 80px auto;
      padding: 40px;
      max-width: 600px;
      text-align: center;
      border-radius: 15px;
      box-shadow: 0 0 20px rgba(0,0,0,0.4);
    }

    .logo {
      width: 100px;
      margin-bottom: 20px;
    }

    h1 {
      margin-bottom: 20px;
      font-size: 2.5em;
    }

    p {
      font-size: 1.2em;
      margin-bottom: 30px;
    }

    .btn {
      padding: 12px 24px;
      margin: 10px;
      background-color: #28a745;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 1em;
      transition: background 0.3s ease;
      text-decoration: none;
    }

    .btn:hover {
      background-color: #218838;
    }
  </style>
</head>
<body>
  <div class="container">
    <img src="images/wall.jpg" alt="Stock Logo" class="logo" />
    <h1>Welcome to the Stock Management System</h1>
    <p>Manage your inventory efficiently and effectively.</p>
    <a href="login.html" class="btn">Login</a>
    <a href="register.html" class="btn">Register</a>
  </div>
</body>
</html>
